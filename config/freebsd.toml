# Basic FreeBSD configuration: start sweetidle inside your Wayland session.
# Install a compatible locker before enabling the lock listener below.
# Optional sleep hooks require installing and enabling freebsd/sweetidle_sleep.
# See README.md for rc.conf setup and the four-second preparation deadline.
# Logind lock/unlock commands and idle hints remain unsupported.

# [general]
# before_sleep_command = "swaylock -f"
# after_resume_command = "sweets msg output-power '*' on"
# wait_before_sleep = true

[[listener]]
timeout = 300
on_timeout = "veila lock --wait-ready"
ignore_inhibit = true

[[listener]]
timeout = 600
on_timeout = "sweets msg output-power '*' off"
on_resume = "sweets msg output-power '*' on"

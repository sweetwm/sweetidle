name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    if: vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    if: vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  check:
    name: Check
    if: vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  test:
    name: Test
    if: vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  reload-integration:
    name: Reload Integration
    if: vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test configuration reload
        run: cargo test --locked --test reload -- --ignored --test-threads=1

  dependencies:
    name: Dependencies
    if: vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: ./scripts/check-deps

  release-check:
    name: Release Check
    if: vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  freebsd:
    name: FreeBSD
    if: vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: freebsd
          version: '15.1'
          memory: 4G
          cpu_count: 2
      - name: Check native build and isolated integrations
        shell: cpa.sh {0}
        run: |
          set -eu
          sudo pkg install -y rust dbus
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --test reload -- --ignored --test-threads=1
          dbus-run-session -- cargo test --locked --lib session::screensaver::tests -- --ignored --test-threads=1
          cargo build --release --locked
          target/release/sweetidle --config config/freebsd.toml --check-config
